name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet build SteelSeriesDiscordStreamFix.csproj -c Release
      - run: dotnet build Launcher/SteelSeriesDiscordStreamFix.Launcher.csproj -c Release
      - run: dotnet test Tests/SteelSeriesDiscordStreamFix.Tests.csproj -c Release
