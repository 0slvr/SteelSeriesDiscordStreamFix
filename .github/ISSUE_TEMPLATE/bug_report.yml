name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: v1.0.46
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: sonar
    attributes:
      label: SteelSeries GG / Sonar version
    validations:
      required: true
  - type: dropdown
    id: discord
    attributes:
      label: Discord client
      options:
        - Stable
        - PTB
        - Canary
        - Development
        - Vesktop
        - Equibop
        - Legcord
        - ArmCord
        - WebCord
        - Dorion
        - Other client (named in "What happened?")
        - Browser (unsupported)
    validations:
      required: true
  - type: checkboxes
    id: hide
    attributes:
      label: Is "Hide Sonar - Chat / Gaming" enabled?
      options:
        - label: Yes, it is enabled
  - type: dropdown
    id: crash
    attributes:
      label: Did the app crash or restart by itself?
      description: After a crash the app restarts itself and shows a notification. Pick the closest answer.
      options:
        - No, it kept running
        - Yes, it restarted itself after an error
        - Yes, and it did NOT come back
        - Not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Open the log from the settings window and paste the relevant part here.
      render: text
