version: 2
updates:
  # NuGet packages of the app, the launcher and the tests.
  # Velopack: the library in both projects AND the `vpk` command-line tool used by publish.ps1 should stay on the
  # same version. The group below bumps both projects together; after merging one of these pull requests, also run
  #   dotnet tool update -g vpk
  # on the machine that runs publish.ps1. The build workflow runs on every pull request, so a broken update shows up
  # as a red check before it is merged.
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/Launcher"
      - "/Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      velopack:
        patterns:
          - "Velopack*"
      build-weavers:
        patterns:
          - "Fody"
          - "Costura.Fody"
      test-tools:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"

  # Actions used by .github/workflows/build.yml (checkout, setup-dotnet).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
